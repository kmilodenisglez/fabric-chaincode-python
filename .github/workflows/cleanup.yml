name: Cleanup Old Workflow Runs

on:
  push:
    branches:
      - main
      - release-2.5
  schedule:
    # Run daily at 2 AM UTC
    - cron: '0 2 * * *'
  workflow_dispatch:
    inputs:
      keep_runs:
        description: Number of latest completed runs to keep per workflow
        required: false
        default: '15'

jobs:
  cleanup:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    concurrency:
      group: workflow-cleanup
      cancel-in-progress: false
    permissions:
      actions: write

    steps:
      - name: Delete old workflow runs
        uses: actions/github-script@v7
        with:
          script: |
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const defaultKeep = 15;
            const inputKeep = Number(context.payload.inputs?.keep_runs || defaultKeep);
            const runsToKeep = Number.isFinite(inputKeep) && inputKeep > 0 ? inputKeep : defaultKeep;

            console.log(`Keeping latest ${runsToKeep} completed runs per workflow`);

            const workflows = await github.paginate(github.rest.actions.listRepoWorkflows, {
              owner,
              repo,
              per_page: 100,
            });

            let deletedCount = 0;
            for (const workflow of workflows) {
              const runs = await github.paginate(github.rest.actions.listWorkflowRuns, {
                owner,
                repo,
                workflow_id: workflow.id,
                status: 'completed',
                per_page: 100,
              });

              runs.sort((a, b) => new Date(b.created_at) - new Date(a.created_at));
              const staleRuns = runs.slice(runsToKeep);

              console.log(`${workflow.name}: found ${runs.length} completed runs, deleting ${staleRuns.length}`);

              for (const run of staleRuns) {
                try {
                  await github.rest.actions.deleteWorkflowRun({ owner, repo, run_id: run.id });
                  deletedCount++;
                } catch (error) {
                  console.log(`Failed to delete run ${run.id}: ${error.message}`);
                }
              }
            }

            console.log(`Deleted ${deletedCount} workflow runs`);
