name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build-and-publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'
      - name: Install build tools
        run: |
          python -m pip install --upgrade pip
          pip install build
      - name: Generate protos (if submodule present)
        run: |
          if [ -d protos/fabric-protos ]; then
            PROTO_SRC=protos/fabric-protos bash scripts/gen_protos.sh
          else
            echo "No submodule protos found; assuming generated protos are committed."
          fi
      - name: Build wheel
        run: python -m build --wheel --no-isolation
      - name: Upload wheel artifact
        uses: actions/upload-artifact@v4
        with:
          name: python-wheel
          path: dist/*.whl
      - name: Publish to PyPI (optional)
        if: ${{ secrets.PYPI_API_TOKEN != '' }}
        run: |
          python -m pip install --upgrade twine
          python -m twine upload dist/* -u __token__ -p ${{ secrets.PYPI_API_TOKEN }}